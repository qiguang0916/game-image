name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate structured examples
        run: python3 scripts/validate_project.py
      - name: Validate explicit runtime-preflight dry-run
        run: |
          python3 scripts/runtime_preflight.py             --asset examples/KNIFE_001/asset.toml             --edit examples/KNIFE_001/edits/rivets-brushed-silver.toml             --dry-run
      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Run host protocol E2E dry-run
        run: python3 scripts/demo_e2e.py
